<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sagiri Profile Bio - @_sagiri0502</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2224%22 font-size=%2224%22>🌸</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* NỀN NGOÀI: Gradient chuyển động */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 110px 16px;
      background: linear-gradient(-45deg, #010101, #0a1122, #00f2fe, #fe2c55, #000000);
      background-size: 400% 400%;
      animation: tiktokGradient 8s ease infinite;
      overflow-x: hidden;
      transition: filter 0.5s ease;
    }

    @keyframes tiktokGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.music-active {
      animation: tiktokGradient 5s ease infinite;
      filter: saturate(1.25);
    }

    /* NÚT TẮT/BẬT TIẾNG GÓC TRÊN BÊN PHẢI */
    .floating-mute-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(37, 244, 238, 0.3);
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.2s ease, background 0.2s ease;
    }

    .floating-mute-btn:hover {
      transform: scale(1.08);
      opacity: 1 !important;
      background: rgba(28, 28, 38, 0.9);
    }

    .floating-mute-btn.idle {
      opacity: 0.35;
    }

    /* KHUNG BỌC VIỀN XOAY CỦA PROFILE CARD */
    .card-border-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      border-radius: 30px;
      padding: 3px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                  0 0 25px rgba(37, 244, 238, 0.2),
                  0 0 25px rgba(254, 44, 85, 0.2);
      transition: box-shadow 0.4s ease;
    }

    .card-border-wrapper::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 150%;
      background: conic-gradient(#25f4ee, #fe2c55, #ff9900, #25f4ee);
      animation: spin 5s linear infinite;
      z-index: 0;
    }

    body.music-active .card-border-wrapper {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85),
                  0 0 30px rgba(37, 244, 238, 0.45),
                  0 0 30px rgba(254, 44, 85, 0.45);
    }

    body.music-active .card-border-wrapper::before {
      animation: spin 2.8s linear infinite;
    }

    /* Khung nội dung profile bên trong */
    .card {
      position: relative;
      width: 100%;
      background: linear-gradient(rgba(14, 14, 18, 0.82), rgba(14, 14, 18, 0.88)), url('card-bg.jpg') center/cover no-repeat;
      background-color: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 34px 22px;
      text-align: center;
      color: #ffffff;
      z-index: 1;
    }

    /* Hiệu ứng viền xoay quanh avatar */
    .avatar-wrapper {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
    }

    .avatar-wrapper::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, #25f4ee, #fe2c55);
      z-index: 0;
      animation: spin 3.5s linear infinite;
      filter: blur(2px);
    }

    body.music-active .avatar-wrapper::before {
      animation: spin 2s linear infinite;
      filter: blur(3px);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #141414;
      z-index: 1;
      background-color: #222;
    }

    /* TÊN SAGIRI CHAN */
    .name {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(90deg, #25f4ee, #fe2c55, #25f4ee);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: nameNeonFlowSlow 8s linear infinite;
      filter: drop-shadow(0 0 10px rgba(37, 244, 238, 0.45)) drop-shadow(0 0 16px rgba(254, 44, 85, 0.45));
      transition: filter 0.4s ease;
    }

    @keyframes nameNeonFlowSlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .heart-icon {
      -webkit-text-fill-color: initial;
      display: inline-block;
      filter: drop-shadow(0 0 6px rgba(254, 44, 85, 0.8));
    }

    body.music-active .name {
      animation: nameNeonFlowSlow 5s linear infinite;
      filter: drop-shadow(0 0 12px rgba(37, 244, 238, 0.75)) drop-shadow(0 0 20px rgba(254, 44, 85, 0.75));
    }

    .handle {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .bio {
      font-size: 0.92rem;
      color: #dedede;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888888;
      margin: 18px 0 10px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* LƯỚI 2 GAME */
    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 6px;
    }

    .game-card-wrapper {
      position: relative;
      border-radius: 18px;
      padding: 2px;
      overflow: hidden;
      display: flex;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
    }

    .game-card-wrapper:hover {
      transform: translateY(-3px);
    }

    .game-card-wrapper::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: conic-gradient(#25f4ee, #fe2c55, #ff9900, #25f4ee);
      animation: spin 4s linear infinite;
      z-index: 0;
    }

    body.music-active .game-card-wrapper::before {
      animation: spin 2.4s linear infinite;
    }

    .game-btn {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      border-radius: 16px;
      background: rgba(18, 18, 22, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      transition: background 0.2s ease;
    }

    .game-card-wrapper:hover .game-btn {
      background: rgba(28, 28, 35, 0.85);
    }

    .game-icon-img {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      object-fit: cover;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #111;
    }

    .game-name {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .game-action {
      font-size: 0.68rem;
      color: #a5a5a5;
      margin-top: 3px;
    }

    /* LIÊN KẾT NÚT NEON TRONG SUỐT */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.93rem;
      transition: all 0.25s ease;
      cursor: pointer;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-link:hover {
      transform: translateY(-2px);
    }

    .btn-tiktok {
      background: rgba(254, 44, 85, 0.12);
      color: #ff3366;
      border: 1.5px solid #fe2c55;
      box-shadow: 0 0 12px rgba(254, 44, 85, 0.35), inset 0 0 8px rgba(254, 44, 85, 0.2);
      text-shadow: 0 0 6px rgba(254, 44, 85, 0.5);
    }
    .btn-tiktok:hover {
      background: rgba(254, 44, 85, 0.22);
      color: #ffffff;
      border-color: #ff6b8b;
      box-shadow: 0 0 20px rgba(254, 44, 85, 0.7), inset 0 0 12px rgba(254, 44, 85, 0.35);
    }

    .btn-donate {
      background: rgba(255, 136, 0, 0.12);
      color: #ffaa33;
      border: 1.5px solid #ff9900;
      box-shadow: 0 0 12px rgba(255, 153, 0, 0.35), inset 0 0 8px rgba(255, 153, 0, 0.2);
      text-shadow: 0 0 6px rgba(255, 153, 0, 0.5);
    }
    .btn-donate:hover {
      background: rgba(255, 136, 0, 0.22);
      color: #ffffff;
      border-color: #ffbe66;
      box-shadow: 0 0 20px rgba(255, 153, 0, 0.7), inset 0 0 12px rgba(255, 153, 0, 0.35);
    }

    .btn-discord {
      background: rgba(88, 101, 242, 0.14);
      color: #7289da;
      border: 1.5px solid #5865F2;
      box-shadow: 0 0 12px rgba(88, 101, 242, 0.35), inset 0 0 8px rgba(88, 101, 242, 0.2);
      text-shadow: 0 0 6px rgba(88, 101, 242, 0.5);
    }
    .btn-discord:hover {
      background: rgba(88, 101, 242, 0.25);
      color: #ffffff;
      border-color: #949efc;
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.7), inset 0 0 12px rgba(88, 101, 242, 0.35);
    }
