<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #080d24 0%, #030511 65%, #010207 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Đốm sáng đom đóm & bụi sao không gian nền */
    .bg-firefly {
      position: absolute;
      background: #ff5c8a;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.45;
      animation: floatFirefly 6.5s infinite ease-in-out;
      z-index: 1;
      filter: drop-shadow(0 0 6px #ff2a6d);
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-28px) scale(1.35); opacity: 0.8; }
    }

    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
      animation: floatEnvelope 3.6s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .envelope {
      position: relative;
      width: 270px;
      height: 175px;
      background: #960c2e;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 48px rgba(255, 30, 80, 0.45), 0 0 35px rgba(255, 60, 100, 0.25);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 135px solid transparent;
      border-right: 135px solid transparent;
      border-top: 108px solid #c9143d;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45));
      transform-origin: top;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 135px solid #a80f33;
      border-right: 135px solid #a80f33;
      border-bottom: 100px solid #d41843;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .heart-seal {
      position: absolute;
      top: 82px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #ffccd5 0%, #ff1a4b 68%, #780216 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.55), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulseSeal 1.6s infinite;
      transition: opacity 0.5s ease;
    }

    @keyframes pulseSeal {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 14px rgba(255, 30, 70, 0.85);
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.84rem;
      color: #ff7597;
      opacity: 0.9;
      letter-spacing: 1px;
    }

    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 236px;
      height: 148px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.88), 0 0 35px rgba(255, 30, 70, 0.45);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
      user-select: text;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff2a55, #c9143d);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(201, 20, 61, 0.5);
      align-self: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .surprise-btn:active {
      transform: scale(0.96);
    }

    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.3s ease;
      z-index: 10;
      touch-action: none;
      cursor: grab;
    }

    #heart-wrapper:active {
      cursor: grabbing;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    /* Gợi ý tương tác cảm ứng cho Mobile */
    #mobile-rotate-hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 15px) + 20px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 13, 36, 0.75);
      border: 1px solid rgba(255, 60, 100, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffccd5;
      font-size: 0.82rem;
      padding: 8px 18px;
      border-radius: 20px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- Audio phát nhạc nền: hỗ trợ file audio.mp3 cùng thư mục -->
  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
    <div id="mobile-rotate-hint">✨ Vuốt màn hình để xoay 360°</div>
  </div>

  <script>
    const fireflyContainer = document.getElementById('fireflies');
    const isMobileDevice = window.innerWidth <= 768;
    const fireflyCount = isMobileDevice ? 25 : 40;
    
    for (let i = 0; i < fireflyCount; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 3.5 + 1.6;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6.5 + 's';
      fireflyContainer.appendChild(fly);
    }

    // Hiệu ứng rê chuột hoặc chạm ngón tay tạo icon lấp lánh
    window.addEventListener('pointermove', (e) => {
      if (Math.random() < (isMobileDevice ? 0.12 : 0.2)) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '❤️' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 35}px, -35px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    }, { passive: true });

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const music = document.getElementById('bg-music');
      if (music) {
        music.play().catch(() => {});
      }

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 500);

      setTimeout(() => {
        letter.classList.add('opened');
      }, 1100);
    }

    function startHeartShow(e) {
      e.stopPropagation();

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 0.9s cubic-bezier(0.4, 0, 0.2, 1)';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => {
          hw.style.opacity = '1';
          const hint = document.getElementById('mobile-rotate-hint');
          if (hint) {
            hint.style.opacity = '1';
            setTimeout(() => { hint.style.opacity = '0'; }, 4500);
          }
        }, 50);
        initMatchPhotoHeart();
      }, 850);
    }

    function initMatchPhotoHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      const isMobile = window.innerWidth <= 768;

      // Cân đối độ phân giải (DPR) nhằm giữ độ nét Retina mà vẫn siêu mượt 60fps trên mobile
      const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
      let width = window.innerWidth;
      let height = window.innerHeight;

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      function createGlowSprite(color, glowColor) {
        const sCanvas = document.createElement('canvas');
        const sDim = 32;
        sCanvas.width = sDim;
        sCanvas.height = sDim;
        const sCtx = sCanvas.getContext('2d');
        const half = sDim / 2;
        const grad = sCtx.createRadialGradient(half, half, 0, half, half, half);
        grad.addColorStop(0, color);
        grad.addColorStop(0.35, glowColor);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        sCtx.fillStyle = grad;
        sCtx.beginPath();
        sCtx.arc(half, half, half, 0, Math.PI * 2);
        sCtx.fill();
        return sCanvas;
      }

      const spriteWhite = createGlowSprite('#ffffff', 'rgba(255, 230, 240, 0.7)');
      const spriteRuby = createGlowSprite('#ff1447', 'rgba(255, 30, 90, 0.5)');
      const spriteRose = createGlowSprite('#ff6b8b', 'rgba(255, 50, 110, 0.45)');

      let rotX = 0.08;
      let rotY = 0;
      let rotVelX = 0;
      let rotVelY = 0.005;
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;

      const hw = document.getElementById('heart-wrapper');
      hw.addEventListener('pointerdown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        rotVelX = 0;
        rotVelY = 0;
      }, { passive: true });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;

        const sensitivity = isMobile ? 0.0085 : 0.007;
        rotY += dx * sensitivity;
        rotX += dy * sensitivity * 0.9;
        rotX = Math.max(-0.55, Math.min(0.55, rotX));

        rotVelY = dx * (isMobile ? 0.0014 : 0.0012);
        rotVelX = dy * (isMobile ? 0.0012 : 0.0010);

        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }, { passive: true });

      window.addEventListener('pointerup', () => { isDragging = false; }, { passive: true });
      window.addEventListener('pointercancel', () => { isDragging = false; }, { passive: true });

      function heartShape2D(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      // 1. Bokeh nền vũ trụ
      const bokehCount = isMobile ? 26 : 45;
      const bokehList = [];
      const bokehColors = [
        'rgba(255, 215, 0, ',
        'rgba(255, 230, 120, ',
        'rgba(0, 210, 255, ',
        'rgba(255, 90, 140, ',
        'rgba(120, 160, 255, '
      ];
      for (let i = 0; i < bokehCount; i++) {
        bokehList.push({
          x: Math.random(),
          y: Math.random(),
          radius: Math.random() * (isMobile ? 16 : 22) + 5,
          baseAlpha: Math.random() * 0.3 + 0.12,
          color: bokehColors[Math.floor(Math.random() * bokehColors.length)],
          speedY: (Math.random() - 0.5) * 0.0003,
          pulseSpeed: Math.random() * 0.02 + 0.01,
          phase: Math.random() * Math.PI * 2
        });
      }

      // 2. Sao 4 cánh lấp lánh
      const starList = [];
      const starCount = isMobile ? 14 : 24;
      for (let i = 0; i < starCount; i++) {
        starList.push({
          x: Math.random(),
          y: Math.random(),
          size: Math.random() * (isMobile ? 9 : 12) + 6,
          alpha: Math.random() * 0.6 + 0.3,
          color: Math.random() > 0.4 ? '#fff0d0' : '#d0e8ff',
          rot: Math.random() * Math.PI,
          speed: Math.random() * 0.03 + 0.01
        });
      }

      const TOTAL_HEART_PARTICLES = isMobile ? 5200 : 6800;
      const heartParticles = [];

      for (let i = 0; i < TOTAL_HEART_PARTICLES; i++) {
        const t = Math.random() * Math.PI * 2;
        const base = heartShape2D(t);

        const isRim = i < TOTAL_HEART_PARTICLES * 0.38;
        const layer = isRim 
          ? (0.93 + Math.random() * 0.08) 
          : (0.15 + Math.sqrt(Math.random()) * 0.82);

        const x2D = base.x * layer;
        const y2D = (base.y - (-2.5)) * layer + (-2.5);

        const lobeDist = Math.abs(x2D) / 16;
        const thickness = Math.sin(Math.min(Math.PI, lobeDist * Math.PI)) * 8.0 + 1.5;
        const z3D = (Math.random() - 0.5) * 2 * thickness * Math.sqrt(Math.max(0.05, 1 - Math.pow(layer - 0.5, 2) * 1.3));

        let spriteType = 'ruby';
        const isFrontFace = z3D > 1.5 && Math.random() < 0.28;
        if ((isRim && Math.random() < 0.42) || isFrontFace) {
          spriteType = 'white';
        } else if (Math.random() < 0.25) {
          spriteType = 'rose';
        }

        const scatterAngle = Math.random() * Math.PI * 2;
        const scatterDist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

        heartParticles.push({
          origX: x2D,
          origY: y2D,
          origZ: z3D,
          currX: width / 2 + Math.cos(scatterAngle) * scatterDist,
          currY: height / 2 + Math.sin(scatterAngle) * scatterDist,
          size: isRim ? (Math.random() * 0.6 + 0.9) : (Math.random() * 0.7 + 0.75),
          sprite: spriteType === 'white' ? spriteWhite : (spriteType === 'rose' ? spriteRose : spriteRuby),
          isWhite: spriteType === 'white',
          progress: 0,
          speed: 0.0035 + Math.random() * 0.0035,
          delay: Math.random() * 60,
          twinkleOffset: Math.random() * Math.PI * 2
        });
      }

      const ribbonItems = [
        { text: "I Love You, Bảo Bei ✨", tier: 0, angleOffset: 0.0 },
        { text: "Anh yêu Bảo Bei 💕",       tier: 0, angleOffset: Math.PI * 0.66 },
        { text: "I Love You, Bảo Bei ✨", tier: 0, angleOffset: Math.PI * 1.33 },
        { text: "Bé iuu Bảo Bei Nhất 💕",  tier: 1, angleOffset: Math.PI * 0.33 },
        { text: "Anh yêu Bảo Bei 💕",       tier: 1, angleOffset: Math.PI * 1.0 },
        { text: "Bé iuu Bảo Bei Nhất 💕",  tier: 1, angleOffset: Math.PI * 1.66 }
      ];

      // Trái tim nhỏ phụ bên cạnh
      const miniHeartParticles = [];
      const MINI_COUNT = isMobile ? 260 : 380;
      for (let i = 0; i < MINI_COUNT; i++) {
        const t = Math.random() * Math.PI * 2;
        const curve = heartShape2D(t);
        const rim = 0.90 + Math.random() * 0.18;
        miniHeartParticles.push({
          relX: curve.x * 0.28 * rim,
          relY: curve.y * 0.28 * rim,
          relZ: (Math.random() - 0.5) * 4,
          sprite: Math.random() < 0.4 ? spriteWhite : spriteRose,
          size: Math.random() * 1.1 + 0.7,
          phase: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      let frame = 0;
      const fov = 420;

      function drawSparkleStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        let rot = (Math.PI / 2) * 3;
        let x = cx, y = cy;
        const step = Math.PI / spikes;

        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          ctx.lineTo(x, y);
          rot += step;
          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        time += 0.026;
        frame++;

        if (!isDragging) {
          rotY += rotVelY;
          rotX += rotVelX;
          rotVelX *= 0.95;
          rotVelY = rotVelY * 0.96 + 0.0055 * 0.04;
        }

        const centerX = width / 2;
        // Căn chỉnh trung tâm chuẩn xác cho màn hình di động
        const heartCenterY = isMobile ? height * 0.41 : height * 0.44;

        // 1. Nền Bokeh
        for (let i = 0; i < bokehList.length; i++) {
          const b = bokehList[i];
          b.y += b.speedY;
          if (b.y < 0) b.y = 1;
          if (b.y > 1) b.y = 0;

          const bx = b.x * width;
          const by = b.y * height;
          const currentAlpha = b.baseAlpha * (0.65 + 0.35 * Math.sin(time * b.pulseSpeed * 20 + b.phase));

          const grad = ctx.createRadialGradient(bx, by, 0, bx, by, b.radius);
          grad.addColorStop(0, b.color + currentAlpha + ')');
          grad.addColorStop(0.6, b.color + (currentAlpha * 0.4) + ')');
          grad.addColorStop(1, b.color + '0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(bx, by, b.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Ngôi sao 4 cánh lấp lánh
        for (let i = 0; i < starList.length; i++) {
          const s = starList[i];
          const sa = s.alpha * (0.5 + 0.5 * Math.sin(time * 2 + i));
          drawSparkleStar(s.x * width, s.y * height, 4, s.size, s.size * 0.22, s.color, sa);
        }

        // Nhịp tim
        const beat = 1 + 0.055 * Math.pow(Math.sin(time * 1.25), 8) + 0.015 * Math.sin(time * 2.5);
        // Tỷ lệ co dãn thích ứng: không bao giờ tràn viền màn hình dọc
        const baseDimension = isMobile ? Math.min(width / 27, height / 44) : Math.min(width, height) / 36;
        const scale = baseDimension * beat;

        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

        // Hào quang hồng phía sau
        const haloGlow = ctx.createRadialGradient(centerX, heartCenterY, 5, centerX, heartCenterY, (isMobile ? 150 : 190) * beat);
        haloGlow.addColorStop(0, 'rgba(255, 35, 95, 0.42)');
        haloGlow.addColorStop(0.4, 'rgba(200, 15, 60, 0.18)');
        haloGlow.addColorStop(0.8, 'rgba(50, 5, 40, 0.06)');
        haloGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = haloGlow;
        ctx.beginPath();
        ctx.arc(centerX, heartCenterY, (isMobile ? 160 : 200) * beat, 0, Math.PI * 2);
        ctx.fill();

        const renderQueue = [];

        // 3. Tính toán 3D hạt trái tim chính
        for (let i = 0; i < heartParticles.length; i++) {
          const p = heartParticles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const ease = 1 - Math.pow(1 - p.progress, 3);

          let x0 = p.origX * scale;
          let y0 = p.origY * scale;
          let z0 = p.origZ * scale;

          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;

          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const projZ = z2 + fov;
          if (projZ <= 40) continue;

          const perspective = fov / projZ;
          const targetProjX = centerX + x1 * perspective;
          const targetProjY = heartCenterY + y2 * perspective;

          const drawX = p.currX + (targetProjX - p.currX) * ease;
          const drawY = p.currY + (targetProjY - p.currY) * ease;

          const depthRatio = Math.max(0.15, Math.min(1.0, (z2 + 150) / 300));
          const twinkle = 0.82 + 0.18 * Math.sin(time * 3.5 + p.twinkleOffset);

          renderQueue.push({
            type: 'sprite_particle',
            x: drawX,
            y: drawY,
            z: z2,
            size: Math.max(1, p.size * perspective * (0.8 + 0.35 * depthRatio) * 2.8),
            sprite: p.sprite,
            alpha: Math.max(0.25, Math.min(1.0, (0.45 + 0.55 * depthRatio) * ease * twinkle))
          });
        }

        // 4. Trái tim nhỏ phụ bên cạnh
        const miniCenterOffsetX = isMobile ? (11.5 * scale) : (18.5 * scale);
        const miniCenterOffsetY = isMobile ? (-13.0 * scale) : (-10.5 * scale);
        const miniFloat = Math.sin(time * 1.5) * 3;

        for (let i = 0; i < miniHeartParticles.length; i++) {
          const mp = miniHeartParticles[i];
          let x0 = miniCenterOffsetX + mp.relX * scale;
          let y0 = miniCenterOffsetY + miniFloat + mp.relY * scale;
          let z0 = mp.relZ * scale;

          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;

          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const projZ = z2 + fov;
          if (projZ <= 40) continue;

          const perspective = fov / projZ;
          const px = centerX + x1 * perspective;
          const py = heartCenterY + y2 * perspective;

          const twinkle = 0.75 + 0.25 * Math.sin(time * 3 + mp.phase);

          renderQueue.push({
            type: 'sprite_particle',
            x: px,
            y: py,
            z: z2,
            size: Math.max(1, mp.size * perspective * 2.4),
            sprite: mp.sprite,
            alpha: Math.max(0.3, Math.min(1.0, twinkle))
          });
        }

        // 5. Vành đai chữ 3D xoay quanh tim
        const ringRadiusX = isMobile ? Math.min(width * 0.44, 160) : Math.min(width * 0.44, 215);
        const ringRadiusZ = ringRadiusX * 0.96;
        const ringBaseY = heartCenterY + (isMobile ? 4.2 : 4.8) * scale;

        for (let i = 0; i < ribbonItems.length; i++) {
          const item = ribbonItems[i];
          const angle = time * 0.32 + item.angleOffset;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          const tierYOffset = (item.tier === 0 ? -11 : 11) * (scale / 18);

          let x0 = cosA * ringRadiusX;
          let y0 = tierYOffset + sinA * 7;
          let z0 = sinA * ringRadiusZ;

          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;

          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const projZ = z2 + fov;
          if (projZ <= 40) continue;

          const perspective = fov / projZ;
          const pX = centerX + x1 * perspective;
          const pY = ringBaseY + y2 * perspective;

          const depthRatio = Math.max(0.1, Math.min(1.0, (z2 + ringRadiusZ) / (2 * ringRadiusZ)));
          const baseFontSize = isMobile ? 10.2 : 11.8;

          renderQueue.push({
            type: 'ribbon_text',
            text: item.text,
            x: pX,
            y: pY,
            z: z2,
            depthRatio: depthRatio,
            fontSize: Math.max(7.5, (baseFontSize + depthRatio * 5.0) * perspective)
          });
        }

        // Sắp xếp thứ tự theo chiều sâu Z từ xa đến gần
        renderQueue.sort((a, b) => a.z - b.z);

        // Vẽ các phần tử theo thứ tự Z
        for (let i = 0; i < renderQueue.length; i++) {
          const item = renderQueue[i];

          if (item.type === 'sprite_particle') {
            ctx.globalAlpha = item.alpha;
            const halfSize = item.size / 2;
            ctx.drawImage(item.sprite, item.x - halfSize, item.y - halfSize, item.size, item.size);
          } else if (item.type === 'ribbon_text') {
            ctx.font = `bold ${Math.max(8.5, item.fontSize)}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const isFront = item.depthRatio > 0.5;
            ctx.globalAlpha = isFront ? 1.0 : (0.35 + 0.45 * item.depthRatio);

            ctx.shadowBlur = isFront ? (isMobile ? 10 : 16) : 4;
            ctx.shadowColor = '#ff3366';
            ctx.strokeStyle = 'rgba(255, 30, 80, 0.7)';
            ctx.lineWidth = isMobile ? 2.0 : 2.5;
            ctx.strokeText(item.text, item.x, item.y);

            ctx.fillStyle = isFront ? '#fffbf2' : '#ffd4df';
            ctx.fillText(item.text, item.x, item.y);
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>
