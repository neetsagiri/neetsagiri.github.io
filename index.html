<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sagiri Profile Bio - @_sagiri0502</title>
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2224%22 font-size=%2224%22>🌸</text></svg>">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      /* Nền gradient TikTok chuyển màu */
      background: linear-gradient(-45deg, #010101, #0a1122, #00f2fe, #fe2c55, #000000);
      background-size: 400% 400%;
      animation: tiktokGradient 8s ease infinite;
      overflow-x: hidden;
    }

    @keyframes tiktokGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 18, 18, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 34px 22px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                  0 0 20px rgba(37, 244, 238, 0.15),
                  0 0 20px rgba(254, 44, 85, 0.15);
      position: relative;
    }

    /* Hiệu ứng viền phát sáng Avatar */
    .avatar-wrapper {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
    }

    .avatar-wrapper::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, #25f4ee, #fe2c55);
      z-index: 0;
      animation: spin 3s linear infinite;
      filter: blur(2px);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #141414;
      z-index: 1;
      background-color: #222;
    }

    .name {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .handle {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .bio {
      font-size: 0.92rem;
      color: #dedede;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* Tiêu đề từng nhóm */
    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888888;
      margin: 18px 0 10px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Lưới hiển thị 2 game yêu thích */
    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 6px;
    }

    .game-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 13px 8px;
      border-radius: 16px;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .game-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .game-btn.wuthering:hover {
      box-shadow: 0 0 15px rgba(37, 244, 238, 0.5);
    }

    .game-btn.lienquan:hover {
      box-shadow: 0 0 15px rgba(254, 44, 85, 0.5);
    }

    .game-icon {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .game-btn.wuthering .game-icon {
      color: #25f4ee;
    }

    .game-btn.lienquan .game-icon {
      color: #fe2c55;
    }

    .game-name {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .game-action {
      font-size: 0.68rem;
      color: #a5a5a5;
      margin-top: 3px;
    }

    /* Nút liên kết */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.93rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: -2px 0 12px rgba(37, 244, 238, 0.4), 2px 0 12px rgba(254, 44, 85, 0.4);
    }

    .btn-tiktok {
      background: #fe2c55;
      border: none;
    }

    .btn-tiktok:hover {
      background: #e02449;
      box-shadow: 0 4px 18px rgba(254, 44, 85, 0.5);
    }

    .footer {
      margin-top: 24px;
      font-size: 0.78rem;
      color: #666666;
    }
  </style>
</head>
<body>

    <div class="avatar-wrapper">
      <img class="avatar" src="avatar.jpg" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=sagiri0502'" alt="Avatar Sagiri" />
    </div>

    <h1 class="name">Sagiri 🌸</h1>

    <!-- Khu vực Game yêu thích -->
    <div class="section-title">
      <i class="fa-solid fa-gamepad"></i> Game yêu thích
    </div>
    <div class="games-grid">
      <!-- Mở Wuthering Waves -->
      <a href="intent://#Intent;package=com.kurogame.wutheringwaves.global;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.kurogame.wutheringwaves.global;end" class="game-btn wuthering">
        <i class="fa-solid fa-bolt game-icon"></i>

        <i class="fa-solid fa-shield-halved game-icon"></i>
        <span class="game-name">Liên Quân Mobile</span>
        <span class="game-action">Mở game ▶</span>

    <!-- Khu vực Liên kết -->
    <div class="section-title" style="margin-top: 16px;">
      <i class="fa-solid fa-link"></i> Liên kết
    </div>
    <div class="links">
      <a href="https://www.tiktok.com/@_sagiri0502" target="_blank" rel="noopener noreferrer" class="btn-link btn-tiktok">
        <i class="fa-brands fa-tiktok"></i> Ghé thăm kênh TikTok
      </a>
      <a href="https://www.tiktok.com/@_sagiri0502" target="_blank" rel="noopener noreferrer" class="btn-link">
        <i class="fa-solid fa-play"></i> Video mới nhất
      </a>
      <a href="#" class="btn-link">
        <i class="fa-brands fa-facebook-messenger"></i> Nhắn tin riêng
      </a>
    </div>

    <div class="footer">
      © @_sagiri0502 • All rights reserved
    </div>
  </div>

</body>
</html>
