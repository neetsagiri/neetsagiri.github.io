<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_sagiri0502</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Nền chuyển động động (Animated Gradient) */
        body {
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background: linear-gradient(-45deg, #0d0e15, #fe2c55, #12141d, #25f4ee);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .avatar-wrap {
            width: 105px;
            height: 105px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fe2c55;
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.5);
        }

        .channel-name {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .bio {
            font-size: 0.95rem;
            color: #e0e2ec;
            margin-bottom: 20px;
            line-height: 1.5;
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }

        .btn-tiktok {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: rgba(22, 24, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: 0.25s ease;
        }

        .btn-tiktok:hover {
            border-color: #fe2c55;
            background: rgba(32, 35, 48, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.3);
        }

        .btn-tiktok i {
            color: #fe2c55;
            font-size: 1.2rem;
        }

        .donate-card {
            background: rgba(15, 16, 21, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .donate-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffb703;
        }

        .donate-desc {
            font-size: 0.85rem;
            color: #cfd3e0;
            margin-bottom: 16px;
        }

        .qr-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px;
            display: inline-block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .qr-img {
            width: 190px;
            height: 190px;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Avatar: Tự nhận file avatar.jpg nếu có, hoặc tạo avatar chữ mặc định -->
        <div class="avatar-wrap">
            <img src="avatar.jpg" alt="Avatar" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=_sagiri0502&background=fe2c55&color=fff'">
        </div>

        <!-- Tên hiển thị -->
        <h1 class="channel-name">@_sagiri0502</h1>
        <p class="bio"> kênh TikTok của mình 💕</p>

        <!-- Nút liên kết kênh TikTok -->
        <a href="https://www.tiktok.com/@_sagiri0502" target="_blank" rel="noopener noreferrer" class="btn-tiktok">
            <i class="fa-brands fa-tiktok"></i> Đến Kênh TikTok Của Tôi
        </a>

        <!-- Khung quét mã Donate -->
        <div class="donate-card">
            <div class="donate-title"> Donate💕 </div>
            <p class="donate-desc">Quét mã QR để ủng hộ mình ly tà tữa💕</p>

            <div class="qr-box">
                <!-- Hiển thị file qr.jpg tải lên, nếu chưa có sẽ tự load mã QR tạm thời -->
                <img src="qr.jpg" alt="QR Code" class="qr-img" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://neetsagiri.github.io'">
            </div>
        </div>
    </div>

</body>
</html>
