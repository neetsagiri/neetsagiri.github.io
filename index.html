<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sagiri Profile Bio - @_sagiri0502</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Hiệu ứng gradient chuyển màu TikTok mượt mà */
      background: linear-gradient(-45deg, #010101, #080d1a, #25f4ee, #fe2c55, #000000);
      background-size: 400% 400%;
      animation: tiktokGradient 9s ease infinite;
    }

    @keyframes tiktokGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 18, 18, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 36px 24px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
    }

    /* Vòng tròn phát sáng xoay 2 tông màu Cyan - Đỏ Hồng */
    .avatar-wrapper::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, #25f4ee, #fe2c55);
      z-index: 0;
      animation: spin 3.5s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #121212;
      z-index: 1;
    }

    .name {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .handle {
      font-size: 0.95rem;
      color: #a3a3a3;
      margin-bottom: 14px;
    }

    .bio {
      font-size: 0.92rem;
      color: #e4e4e4;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .stat-item h4 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .stat-item p {
      font-size: 0.75rem;
      color: #909090;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease;
    }

    .btn-link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: -2px 0 10px rgba(37, 244, 238, 0.35), 2px 0 10px rgba(254, 44, 85, 0.35);
    }

    .btn-tiktok {
      background: #fe2c55;
      border: none;
    }

    .btn-tiktok:hover {
      background: #e02449;
      box-shadow: 0 4px 15px rgba(254, 44, 85, 0.45);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <!-- Thay link ảnh đại diện của bạn vào src bên dưới -->
      <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=sagiri0502" alt="Avatar Sagiri" />
    </div>

    <h1 class="name">Sagiri 🌸</h1>
    <p class="handle">@_sagiri0502</p>
    <p class="bio">✨ Chào mừng bạn đến với góc nhỏ của Sagiri!<br>🎨 Chia sẻ video & nội dung sáng tạo mỗi ngày.</p>

    <!-- Bạn có thể chỉnh lại các con số thống kê theo thực tế kênh của bạn -->
    <div class="stats">
      <div class="stat-item">
        <h4>--</h4>
        <p>Đang theo</p>
      </div>
      <div class="stat-item">
        <h4>--</h4>
        <p>Follower</p>
      </div>
      <div class="stat-item">
        <h4>--</h4>
        <p>Lượt thích</p>
      </div>
    </div>

    <div class="links">
      <!-- Nút mở trực tiếp kênh TikTok của bạn -->
      <a href="https://www.tiktok.com/@_sagiri0502" target="_blank" class="btn-link btn-tiktok">
        <i class="fa-brands fa-tiktok"></i> Ghé thăm kênh TikTok
      </a>
      <a href="https://www.tiktok.com/@_sagiri0502" target="_blank" class="btn-link">
        <i class="fa-solid fa-play"></i> Video mới nhất
      </a>
      <a href="#" class="btn-link">
        <i class="fa-brands fa-facebook-messenger"></i> Nhắn tin riêng
      </a>
    </div>
  </div>

</body>
</html>
